name: Publish Operation Gobble
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Configure live game API
        env:
          GOBBLE_API_URL: ${{ vars.GOBBLE_API_URL }}
        run: |
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const value = process.env.GOBBLE_API_URL?.trim() || "";
            if (value && new URL(value).protocol !== "https:") throw new Error("Use an HTTPS API URL");
            writeFileSync("public/config.js", "export const apiBase = " + JSON.stringify(value.replace(/\/+$/, "")) + ";\n");
          '
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deploy
